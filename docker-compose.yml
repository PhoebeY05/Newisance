services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: newisance
      POSTGRES_PASSWORD: newisance
      POSTGRES_DB: newisance
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  game-service:
    build:
      context: .
      dockerfile: backend/game-service/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://newisance:newisance@postgres:5432/newisance
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    ports:
      - '8001:8001'

  dashboard-service:
    build:
      context: .
      dockerfile: backend/dashboard-service/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://newisance:newisance@postgres:5432/newisance
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    ports:
      - '8002:8002'

  community-service:
    build:
      context: .
      dockerfile: backend/community-service/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://newisance:newisance@postgres:5432/newisance
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    ports:
      - '8003:8003'
    volumes:
      # Persist uploaded media across rebuilds (default LOCAL_MEDIA_DIR=/app/media_uploads).
      - media_uploads:/app/media_uploads

  ai-service:
    build:
      context: .
      dockerfile: backend/ai-service/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    # ai-service has no public port (worker)

volumes:
  pgdata:
  media_uploads:
